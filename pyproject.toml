[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-db"
version = "1.0.0"
description = "Notion Personal Knowledge OS ingest pipeline (extract -> classify -> store)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "notion-client>=2.2.1",
    "openai>=1.51.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "trafilatura>=1.9.0",
    "beautifulsoup4>=4.12.3",
    "pypdf>=4.2.0",
]

[project.scripts]
knowledge-db = "knowledge_db.worker:main"

[tool.setuptools.packages.find]
include = ["knowledge_db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
